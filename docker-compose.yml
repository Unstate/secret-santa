# Локальная разработка: только Postgres, бекенд запускается нативно
# (cargo run из backend/), фронт — pnpm dev из frontend/.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: santa
      POSTGRES_PASSWORD: santa
      POSTGRES_DB: santa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa -d santa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
