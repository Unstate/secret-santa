# Прод-окружение: образ собирает .github/workflows/deploy.yml и кладёт в GHCR.
# Перед первым деплоем замените image на свой репозиторий (в нижнем регистре).
services:
  app:
    image: ghcr.io/OWNER/REPO:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://santa:santa@db:5432/santa
      PORT: "8080"
      RUST_LOG: info
    ports:
      - "80:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: santa
      POSTGRES_PASSWORD: santa
      POSTGRES_DB: santa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa -d santa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
