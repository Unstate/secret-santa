services:
  frontend:
    image: ghcr.io/OWNER/REPO-frontend:latest
    build: ./frontend
    restart: "no"
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ghcr.io/OWNER/REPO-backend:latest
    build: ./backend
    restart: "no"
    environment:
      DATABASE_URL: postgres://santa:santa@db:5432/santa
      PORT: "8080"
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_USER: santa
      POSTGRES_PASSWORD: santa
      POSTGRES_DB: santa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U santa -d santa"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
