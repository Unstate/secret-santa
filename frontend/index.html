<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Тайный Санта — распределение подарков по-честному</title>
    <meta
      name="description"
      content="Создайте комнату и позовите друзей по ссылке: тайный шафл с исключениями, вишлисты и праздничное настроение. Пары остаются в секрете до самого праздника."
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph: превью в Telegram, VK, WhatsApp и т.д. og:image относительный —
         соцсети достраивают его сами; og:url добавим, когда определится домен. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Тайный Санта" />
    <meta property="og:title" content="Тайный Санта — распределение подарков по-честному" />
    <meta
      property="og:description"
      content="Создайте комнату и позовите друзей по ссылке: тайный шафл с исключениями, вишлисты и праздничное настроение. Пары остаются в секрете до самого праздника."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Медвежонок в шапке Санты с подарками под гирляндой — надпись «Тайный Санта»"
    />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Тайный Санта — распределение подарков по-честному" />
    <meta
      name="twitter:description"
      content="Создайте комнату и позовите друзей по ссылке: тайный шафл с исключениями, вишлисты и праздничное настроение."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Цвет адресной строки мобильного браузера под фон темы -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9eff7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1724" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('santa-theme')
          const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/core/main.tsx"></script>
  </body>
</html>
